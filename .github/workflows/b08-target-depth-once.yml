name: B08 target-depth one-time pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b08-target-depth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B08 target-depth pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deepen chapters 38 to 43
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b08-target-depth-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')

          labels = ['38','39','40','41','42','43']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()

          def insert_after(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'chapter {label}: anchor count {count}: {anchor!r}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)

          text = insert_after(text, '„Ab jetzt nur noch unser Stand“, sagte er.\n', parts['38'], '38')
          text = insert_after(text, 'Der erste war nicht falsch gewesen.\n\nEr war nur langsamer.\n', parts['39'], '39')
          text = insert_after(text, 'Daniel machte den zweiten Schritt.\n\nJetzt hätte er springen können.\n', parts['40'], '40')
          text = insert_after(text, 'Sie durfte schneller sehen.\n\nSie durfte nicht schneller urteilen.\n', parts['41'], '41')
          text = insert_after(text, '„Was brauchst du von mir?“ fragte er.\n', parts['42'], '42')
          text = insert_after(text, '„Distanz schließen. Ihn körperlich stoppen. Darauf vertrauen, dass die Einsatzführung meinen Widerruf rechtzeitig gegen seine Meldung hält.“\n', parts['43'], '43')

          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b08-target-depth-once.yml .github/b08-target-depth-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Deepen finale block toward target weight'
          git push
