name: Fix midpoint reader-pass seam
on:
  push:
    paths:
      - '.github/workflows/fix-midpoint-seam-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicated midpoint anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          t=p.read_text(encoding='utf-8')
          old='Nicht: Wer kannte den Fall?Nicht: Wer kannte den Fall?'
          if t.count(old) != 1:
              raise SystemExit(f'expected duplicated midpoint seam once, found {t.count(old)}')
          t=t.replace(old,'Nicht: Wer kannte den Fall?',1)
          for needle in ['Wer kannte ihn?','bevor Daniel selbst wusste, dass es einen Fall gab?','Im Moment meinte er jedes Wort.']:
              if needle not in t: raise SystemExit(f'protected anchor lost: {needle}')
          p.write_text(t,encoding='utf-8')
          print('PASS midpoint seam')
          PY
      - name: Self-remove and commit
        shell: bash
        run: |
          git rm .github/workflows/fix-midpoint-seam-once.yml
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix midpoint reader-pass seam'
          git push