name: Verified final manuscript build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-manuscript-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Build verified final manuscript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate sources and build true consolidated manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('MANUSKRIPT/01_BAUSTEINE_01_02.md'),
              Path('MANUSKRIPT/02_BAUSTEINE_03_04.md'),
              Path('MANUSKRIPT/03_BAUSTEINE_05_06.md'),
              Path('MANUSKRIPT/04_BAUSTEIN_07.md'),
              Path('MANUSKRIPT/05_BAUSTEINE_08_09.md'),
          ]
          expected_by_file = [
              ['Prolog'] + [str(i) for i in range(1,7)],
              [str(i) for i in range(7,19)],
              [str(i) for i in range(19,34)],
              [str(i) for i in range(34,38)],
              [str(i) for i in range(38,48)],
          ]
          heading_re = re.compile(r'^##\s+(Prolog|\d+)\s*$', re.MULTILINE)
          word_re = re.compile(r"\b[\wÄÖÜäöüß]+(?:[-’'][\wÄÖÜäöüß]+)*\b", re.UNICODE)

          texts = [p.read_text(encoding='utf-8') for p in paths]

          # Final continuity clarification: Prolog shows Heller's visible right hand empty.
          old = 'Heller hob das Terminal.\n\nDaniel sah die vorbereitete Meldung auf dem Display.'
          new = 'Heller hob das Terminal in der linken Hand.\n\nDaniel sah die vorbereitete Meldung auf dem Display.'
          if texts[4].count(old) != 1:
              raise SystemExit(f'Cold-open hand continuity anchor count={texts[4].count(old)}')
          texts[4] = texts[4].replace(old, new, 1)

          forbidden = [
              'CLEANUP_TMP_BRANCHES',
              'temporary metrics trigger',
              '===b0',
              '===ch',
              'TODO:',
              'FIXME',
              'PLACEHOLDER',
          ]
          for path, text, exp in zip(paths, texts, expected_by_file):
              heads = [m.group(1) for m in heading_re.finditer(text)]
              if heads != exp:
                  raise SystemExit(f'{path}: headings {heads} != {exp}')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'{path}: forbidden artifact {token!r}')

          sections = {}
          for text in texts:
              matches = list(heading_re.finditer(text))
              for i, m in enumerate(matches):
                  name = m.group(1)
                  end = matches[i+1].start() if i+1 < len(matches) else len(text)
                  body = text[m.end():end].strip()
                  body = re.sub(r'\n\s*---\s*$', '', body).strip()
                  if not body:
                      raise SystemExit(f'empty chapter {name}')
                  sections[name] = body

          expected = ['Prolog'] + [str(i) for i in range(1,48)]
          if list(sections.keys()) != expected:
              raise SystemExit('global chapter order changed')

          # Semantic invariants that must survive the expansion/final pass.
          must = {
              '25': ['Wer kannte ihn?', 'bevor Daniel selbst wusste, dass es einen Fall gab'],
              '33': ['Ich baue die breiten Möglichkeiten jetzt nicht vollständig zurück', 'Entscheidung zur vorläufigen Fortführung: Reuter'],
              '38': ['Ab jetzt nur noch unser Stand', 'Vorgezogene Freigabe'],
              '39': ['Wir bleiben bei der Projektstruktur', 'engeren Weg'],
              '40': ['Markus Heller lag auf der nassen Betonfläche.', 'Terminal in der linken Hand', 'Nicht gesendet.'],
              '43': ['Heller starb am nächsten Morgen um 5.18 Uhr.', 'drei Mappen'],
              '44': ['Verbundprüfung'],
              '45': ['Hamburg'],
              '46': ['Verbundprüfung'],
              '47': ['hundertzwanzig', 'stärkste Gegenhypothese'],
          }
          for ch, needles in must.items():
              for needle in needles:
                  if needle not in sections[ch]:
                      raise SystemExit(f'chapter {ch}: missing invariant {needle!r}')

          if 'Die Hand war leer' not in sections['Prolog']:
              raise SystemExit('Prolog empty-hand fact missing')
          if 'Heller starb' in sections['40']:
              raise SystemExit('Heller dies too early in chapter 40')
          if not sections['47'].rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“'):
              raise SystemExit('chapter 47 no longer ends before the decision')

          # Detect accidental adjacent repetition from expansion patching.
          # Check repeated blocks of 1-3 consecutive paragraphs, not only one long paragraph.
          for ch in expected:
              paras = [re.sub(r'\s+', ' ', p).strip() for p in re.split(r'\n\s*\n', sections[ch])]
              paras = [p for p in paras if p and p != '---']
              for span in (1, 2, 3):
                  for i in range(0, len(paras) - 2 * span + 1):
                      left = paras[i:i+span]
                      right = paras[i+span:i+2*span]
                      if left == right and len(' '.join(left)) >= 50:
                          raise SystemExit(f'chapter {ch}: adjacent duplicate block span={span}: {" | ".join(left)[:120]}')

          # Explicitly guard against the near-duplicate Ch27 pair found in reader QA.
          if ('Die Tatsache, dass jemand wusste, welchen Ausgang sie benutzt hatte, bewies genau eine Sache: Jemand wusste es.' in sections['27']
              and 'Die Tatsache, dass jemand wusste, welchen Ausgang Jana benutzt hatte, bewies genau eine Sache: Jemand wusste es.' in sections['27']):
              raise SystemExit('chapter 27: redundant pronoun/name duplicate survived cleanup')

          total = sum(len(word_re.findall(sections[ch])) for ch in expected)
          if not 75000 <= total <= 80000:
              raise SystemExit(f'word corridor failed: {total}')

          chunks = ['# Ausnahmezustand']
          for ch in expected:
              chunks.append(f'## {ch}\n\n{sections[ch]}')
          final = '\n\n---\n\n'.join(chunks) + '\n'

          final_heads = [m.group(1) for m in heading_re.finditer(final)]
          if final_heads != expected:
              raise SystemExit('final file chapter order invalid')
          if '# Manuskript –' in final:
              raise SystemExit('source-file wrapper leaked into final manuscript')
          final_total = sum(len(word_re.findall(sections[ch])) for ch in expected)
          if final_total != total:
              raise SystemExit('final/source word mismatch')

          paths[4].write_text(texts[4], encoding='utf-8')
          Path('AUSNAHMEZUSTAND_FINAL.md').write_text(final, encoding='utf-8')

          print(f'PASS chapters={len(expected)} words={total}')
          print('PASS Cold Open/Heller continuity')
          print('PASS Reversal/finale/end invariants')
          print('PASS adjacent 1-3 paragraph repetition scan')
          print('PASS no temporary artifacts')
          print('PASS true consolidated manuscript generated')
          PY

      - name: Self-remove and commit verified final manuscript
        shell: bash
        run: |
          git rm .github/workflows/final-manuscript-build-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md AUSNAHMEZUSTAND_FINAL.md
          git commit -m 'Create verified consolidated final manuscript'
          git push
