name: B06 final one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b06-final-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply final B06 expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final B06 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manuscript = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          patchpath = Path('.github/b06-final-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          p = patchpath.read_text(encoding='utf-8')

          a26 = p.split('===ADD26===\n', 1)[1].split('===ADD27===\n', 1)[0].strip()
          a27 = p.split('===ADD27===\n', 1)[1].split('===ADD28===\n', 1)[0].strip()
          a28 = p.split('===ADD28===\n', 1)[1].split('===REPLACE30_33===\n', 1)[0].strip()
          rep = p.split('===REPLACE30_33===\n', 1)[1].strip() + '\n'

          def insert_after(text, anchor, addition, label):
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: expected anchor once, got {count}')
              return text.replace(anchor, anchor + '\n' + addition + '\n', 1)

          anchor26 = 'Daniel sah den Versandstatus.\n\nDamit war es keine Notiz mehr, die er später anders erinnern konnte.\n'
          text = insert_after(text, anchor26, a26, 'chapter 26')

          anchor27 = 'Alles erklärbar.\n'
          if text.count(anchor27) != 1:
              raise SystemExit(f'chapter 27: expected anchor once, got {text.count(anchor27)}')
          text = text.replace(anchor27, anchor27 + '\n' + a27 + '\n', 1)

          anchor28 = '„Sie holt mich ab. Ich fahre morgen nicht mit meinem Auto. Den ersten Termin habe ich abgesagt, den zweiten macht sie. Ich schlafe heute nicht zu Hause.“\n'
          text = insert_after(text, anchor28, a28, 'chapter 28')

          text, count = re.subn(r'## 30\n.*\Z', lambda m: rep, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'chapters 30-33: expected block once, got {count}')

          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b06-final-once.yml .github/b06-final-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Complete moral pivot block through chapter 33'
          git push
