name: Remove five final repetition artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-final-five-repeats-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Remove five final repetition artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove verified repeated blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          text = path.read_text(encoding='utf-8')
          blocks = [
              '„Ab jetzt nur noch unser Stand“, sagte er.',
              'Daniel machte den zweiten Schritt.\n\nJetzt hätte er springen können.',
              'Sie durfte schneller sehen.\n\nSie durfte nicht schneller urteilen.',
              '„Was brauchst du von mir?“ fragte er.',
              '„Distanz schließen. Ihn körperlich stoppen. Darauf vertrauen, dass die Einsatzführung meinen Widerruf rechtzeitig gegen seine Meldung hält.“',
          ]
          for block in blocks:
              doubled = block + '\n\n' + block
              count = text.count(doubled)
              if count != 1:
                  raise SystemExit(f'expected one repeated block, found {count}: {block[:90]!r}')
              text = text.replace(doubled, block, 1)
          for block in blocks:
              if block + '\n\n' + block in text:
                  raise SystemExit(f'repetition remained: {block[:90]!r}')
          path.write_text(text, encoding='utf-8')
          print('PASS removed 5 final repetition artifacts')
          PY
      - name: Self-remove and commit
        shell: bash
        run: |
          git rm .github/workflows/remove-final-five-repeats-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Remove five final repetition artifacts'
          git push
