name: Apply entry reader-pass
on:
  push:
    paths:
      - '.github/workflows/entry-reader-pass-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical entry pass
        run: python .github/entry_reader_pass_patch.py
      - name: Validate chapter structure and direct repeats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [Path('MANUSKRIPT/01_BAUSTEINE_01_02.md'), Path('MANUSKRIPT/02_BAUSTEINE_03_04.md')]
          expected = [['Prolog']+[str(i) for i in range(1,7)], [str(i) for i in range(7,19)]]
          for p, exp in zip(files, expected):
              t=p.read_text(encoding='utf-8')
              h=re.findall(r'^##\s+(Prolog|\d+)\s*$', t, re.M)
              assert h==exp, (p,h)
              ms=list(re.finditer(r'^##\s+(Prolog|\d+)\s*$', t, re.M))
              for i,m in enumerate(ms):
                  end=ms[i+1].start() if i+1<len(ms) else len(t)
                  body=t[m.end():end]
                  paras=[re.sub(r'\s+',' ',x).strip() for x in re.split(r'\n\s*\n',body)]
                  paras=[x for x in paras if x and x!='---']
                  for j in range(len(paras)-1):
                      if paras[j]==paras[j+1] and len(paras[j])>15:
                          raise SystemExit(f'{p} ch {m.group(1)} direct repeat: {paras[j][:120]}')
          print('PASS structure/repeats')
          PY
      - name: Commit manuscript and self-clean
        shell: bash
        run: |
          git rm .github/workflows/entry-reader-pass-once.yml .github/entry_reader_pass_patch.py
          git add MANUSKRIPT/01_BAUSTEINE_01_02.md MANUSKRIPT/02_BAUSTEINE_03_04.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Tighten opening reader flow through chapter 10'
          git push
# retry after chapter-9 anchor correction