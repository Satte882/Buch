name: B08 critical closure one-time pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b08-critical-close-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply final critical B08 closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final critical additions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b08-critical-close-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['39','40','41']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          def ins(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: anchor count {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          text = ins(text, 'Daniel faltete ihn nicht zusammen.\n\nEr ließ ihn liegen.\n', parts['39'], '39')
          text = ins(text, 'Was jetzt noch von ihm gebraucht wurde, war nicht die Entscheidung über Kräfte draußen, sondern der letzte saubere Stand seines Ermittlungsstrangs.\n', parts['40'], '40')
          text = ins(text, 'Beides musste später in dieselbe Akte.\n', parts['41'], '41')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b08-critical-close-once.yml .github/b08-critical-close-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Complete critical finale chapter weights'
          git push