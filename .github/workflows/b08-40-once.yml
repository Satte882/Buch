name: B08 chapter 40 one-time expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b08-40-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply chapter 40 expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand chapter 40
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b08-40-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['40a','40b','40c']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          def ins(src, anchor, addition, label):
              if src.count(anchor) != 1:
                  raise SystemExit(f'{label}: anchor count {src.count(anchor)}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          def rep(src, old, new, label):
              if src.count(old) != 1:
                  raise SystemExit(f'{label}: replace count {src.count(old)}')
              return src.replace(old, new, 1)
          text = ins(text, 'Acht Beschäftigte eines anderen Dienstleisters, die dort noch arbeiteten. Regulär. Nicht im alten Lagebild.\n', parts['40a'], '40a')
          old_b = '''Daniel war drei, vielleicht vier Meter entfernt.\n\nEr hätte loslaufen können.\n\nZwei Schritte, vielleicht drei.\n\nHeller am Arm packen.\n\nDas Terminal aus der Hand schlagen.\n\nDarauf vertrauen, dass die Einsatzführung Daniels Widerruf höher gewichtete als eine zweite Meldung.\n\nAlles möglich.\n\nNichts sicher.\n'''
          text = rep(text, old_b, parts['40b'] + '\n', '40b')
          old_c = '''Nicht gesendet.\n\nIm Ohr hörte er Stimmen.\n\n„Reuter? Wir haben einen Schuss. Status?“\n\nDaniel atmete einmal ein.\n\n„Alte Bestätigung bleibt zurückgezogen.“\n\n„Verstanden. Zugriff hält.“\n\n„Unbeteiligte im Bereich. Neue Route.“\n'''
          text = rep(text, old_c, 'Nicht gesendet.\n\n' + parts['40c'] + '\n', '40c')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b08-40-once.yml .github/b08-40-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Deepen cold-open payoff in chapter 40'
          git push