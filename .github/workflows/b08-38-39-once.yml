name: B08 chapters 38 and 39 one-time expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b08-38-39-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B08 chapters 38 and 39 expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand chapters 38 and 39
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b08-38-39-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['38a','38b','39a','39b']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          def ins(src, anchor, addition, label):
              if src.count(anchor) != 1:
                  raise SystemExit(f'{label}: anchor count {src.count(anchor)}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          text = ins(text, 'Zwei voneinander getrennte Dinge.\n\nNoch.\n', parts['38a'], '38a')
          text = ins(text, 'Ein bereits benutzter Ausweis.\n', parts['38b'], '38b')
          text = ins(text, '„Heute reichen zwei.“\n', parts['39a'], '39a')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b08-38-39-once.yml .github/b08-38-39-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Expand finale setup chapters 38 and 39'
          git push