name: B05 target-depth one-time pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b05-target-depth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B05 target-depth pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deepen chapters 19 to 25
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          patchfile = Path('.github/b05-target-depth-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')

          labels = ['19','20','21','22','23','24','25']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()

          def insert_after(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'chapter {label}: anchor count {count}: {anchor!r}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)

          text = insert_after(text, '„Nach dem, was er nicht weiß.“\n', parts['19'], '19')
          text = insert_after(text, 'Das war weniger befriedigend.\n\nUnd sauberer.\n', parts['20'], '20')
          text = insert_after(text, 'Es fühlte sich nicht an wie mehr Macht.\n\nEs fühlte sich an wie weniger Reibung.\n', parts['21'], '21')
          text = insert_after(text, '„Dann entscheide ich mit dem, was ich habe.“\n', parts['22'], '22')
          text = insert_after(text, '**Relatives Auffallen ist kein zusätzlicher Treffer.**\n', parts['23'], '23')
          text = insert_after(text, 'Nur eine Korrektur, die langsamer wirkte als der Verdacht.\n', parts['24'], '24')
          text = insert_after(text, 'Nur in seinem engsten Arbeitsstand.\n\nDer Cursor blieb danach im leeren Feld stehen.\n', parts['25'], '25')

          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b05-target-depth-once.yml .github/b05-target-depth-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Deepen escalation block toward target weight'
          git push
