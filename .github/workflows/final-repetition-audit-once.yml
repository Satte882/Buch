name: Final manuscript repetition audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-repetition-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit final manuscript repetitions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan direct and near-direct repetition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from difflib import SequenceMatcher

          paths = [
              Path('MANUSKRIPT/01_BAUSTEINE_01_02.md'),
              Path('MANUSKRIPT/02_BAUSTEINE_03_04.md'),
              Path('MANUSKRIPT/03_BAUSTEINE_05_06.md'),
              Path('MANUSKRIPT/04_BAUSTEIN_07.md'),
              Path('MANUSKRIPT/05_BAUSTEINE_08_09.md'),
          ]
          heading_re = re.compile(r'^##\s+(Prolog|\d+)\s*$', re.M)
          exact = []
          near = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              matches = list(heading_re.finditer(text))
              for j, m in enumerate(matches):
                  ch = m.group(1)
                  end = matches[j+1].start() if j+1 < len(matches) else len(text)
                  body = text[m.end():end].strip()
                  paras = [re.sub(r'\s+', ' ', p).strip() for p in re.split(r'\n\s*\n', body)]
                  paras = [p for p in paras if p and p != '---']
                  for span in (1,2,3):
                      for i in range(len(paras)-2*span+1):
                          left = paras[i:i+span]
                          right = paras[i+span:i+2*span]
                          joined = ' | '.join(left)
                          if left == right and len(' '.join(left)) >= 15:
                              exact.append((ch, span, i, joined[:220]))
                  for i in range(len(paras)-1):
                      a,b = paras[i], paras[i+1]
                      if min(len(a),len(b)) < 55 or a == b:
                          continue
                      ratio = SequenceMatcher(None, a, b).ratio()
                      if ratio >= 0.88:
                          near.append((ch, i, ratio, a[:140], b[:140]))
          print('=== EXACT ADJACENT REPEATS ===')
          for row in exact:
              print(row)
          print(f'EXACT_COUNT={len(exact)}')
          print('=== NEAR ADJACENT REPEATS ===')
          for row in near:
              print(row)
          print(f'NEAR_COUNT={len(near)}')
          PY
      - name: Self-remove audit workflow
        shell: bash
        run: |
          git rm .github/workflows/final-repetition-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove final repetition audit workflow'
          git push
