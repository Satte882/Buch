name: B06 target-depth one-time pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b06-target-depth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B06 target-depth pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deepen chapters 26 to 33
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          patchfile = Path('.github/b06-target-depth-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')

          labels = ['26','27','28','29','30','31','32','33']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()

          def insert_after(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'chapter {label}: anchor count {count}: {anchor!r}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)

          text = insert_after(text, 'Damit war es keine Notiz mehr, die er später anders erinnern konnte.\n', parts['26'], '26')
          text = insert_after(text, 'Die Tatsache, dass jemand wusste, welchen Ausgang sie benutzt hatte, bewies genau eine Sache: Jemand wusste es.\n', parts['27'], '27')
          text = insert_after(text, 'Das war der Kompromiss.\n\nNicht seiner.\n\nIhrer.\n', parts['28'], '28')
          text = insert_after(text, 'Das war schlimmer als ein eindeutiger Fehlschlag.\n', parts['29'], '29')
          text = insert_after(text, 'Lena war nicht das Leck.\n', parts['30'], '30')
          text = insert_after(text, '„Dann schließen wir sie nicht als harmlos“, sagte er. „Aber wir machen auch nichts daraus, bis ein zweiter Anker kommt.“\n', parts['31'], '31')
          text = insert_after(text, 'Nicht alles daran betraf ihn.\n\nDas war vermutlich der Punkt.\n', parts['32'], '32')
          text = insert_after(text, 'In Kapitel 1 hätte ihm das gereicht.\n', parts['33'], '33')

          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b06-target-depth-once.yml .github/b06-target-depth-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Deepen moral-pivot block toward target weight'
          git push
