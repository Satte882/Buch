name: Chapter 27 final evidence-boundary beat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch27-final-boundary-beat-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add final chapter 27 evidence boundary beat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert one functional beat
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          text = path.read_text(encoding='utf-8')
          anchor = '**Privatwissen erhöht Druck, nicht Gefahrenevidenz.**'
          addition = '''Daniel zog darunter eine zweite Linie. Neben Janas Namen schrieb er keine Dringlichkeitsstufe.

Er hätte sie ohne Mühe als Argument benutzen können. Fünfzehn Minuten alte Beobachtung. Schwester. Unbekannte Quelle. Jeder im Raum hätte verstanden, warum er deshalb schneller werden wollte.

Genau das war das Problem.

Wenn die Lieferfreigabe gefährlich war, musste sie auch ohne Jana gefährlich sein. Wenn sie harmlos war, durfte seine Angst den fehlenden zweiten Anker nicht ersetzen.

Er schob das Blatt so hin, dass Jonas es sehen konnte.

Die Trennung sollte nicht nur in seinem Kopf existieren.'''
          if text.count(anchor) != 1:
              raise SystemExit(f'anchor count={text.count(anchor)}')
          text = text.replace(anchor, anchor + '\n\n' + addition, 1)
          path.write_text(text, encoding='utf-8')
          print('PASS inserted one evidence-boundary beat')
          PY

      - name: Self-remove and commit
        shell: bash
        run: |
          git rm .github/workflows/ch27-final-boundary-beat-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Strengthen chapter 27 evidence boundary'
          git push
