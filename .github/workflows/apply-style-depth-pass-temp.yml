name: Temporary targeted style depth pass

on:
  push:
    paths:
      - scripts/apply_style_depth_pass_temp.py
      - .github/workflows/apply-style-depth-pass-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted style depth pass
        run: python scripts/apply_style_depth_pass_temp.py
      - name: Validate manuscript structure
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('AUSNAHMEZUSTAND_FINAL.md').read_text(encoding='utf-8')
          assert re.findall(r'^## (Prolog|\d+)$', text, re.M) == ['Prolog'] + [str(i) for i in range(1, 48)]
          assert text.rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“')
          assert '—' not in text
      - name: Commit prose refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSNAHMEZUSTAND_FINAL.md
          git commit -m "Refine prose contrast and style formulas"
          git pull --rebase origin main
          git push
