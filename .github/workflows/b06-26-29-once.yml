name: B06 chapters 26-29 one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b06-26-29-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B06 chapters 26-29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace chapters 26 to 29
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          manuscript = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          patch = Path('.github/b06-26-29.txt')
          text = manuscript.read_text(encoding='utf-8')
          replacement = patch.read_text(encoding='utf-8').rstrip() + '\n\n'
          pattern = re.compile(r'## 26\n.*?(?=## 30\n)', re.S)
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one chapter 26-29 block, got {count}')
          manuscript.write_text(new_text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b06-26-29-once.yml .github/b06-26-29.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Expand moral pivot chapters 26 to 29'
          git push
