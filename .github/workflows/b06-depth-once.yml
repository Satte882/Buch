name: B06 depth one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b06-depth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B06 depth completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply B06 depth additions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          patchpath = Path('.github/b06-depth-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          p = patchpath.read_text(encoding='utf-8')

          labels = ['ADD28', 'ADD30', 'ADD31', 'ADD32', 'ADD33']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = p.index(marker) + len(marker)
              if i + 1 < len(labels):
                  next_marker = f'==={labels[i+1]}===\n'
                  end = p.index(next_marker, start)
              else:
                  end = len(p)
              parts[label] = p[start:end].strip()

          def insert_after(anchor, addition, label):
              nonlocal_text = None
              return

          def apply_once(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: expected anchor once, got {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)

          text = apply_once(
              text,
              'Schrieb **Meld dich, wenn ihr da seid.**\n\nSchickte es.\n',
              parts['ADD28'],
              'chapter 28'
          )
          text = apply_once(
              text,
              'Daniel folgte ihr nicht.\n',
              parts['ADD30'],
              'chapter 30'
          )
          text = apply_once(
              text,
              '„Weiter“, sagte er.\n',
              parts['ADD31'],
              'chapter 31'
          )
          text = apply_once(
              text,
              '„Dass ich die Rolle will. Das Team. Die Verantwortung. Und dass ich keine perfekte Lösung brauche, um zu wissen, dass ich es versuchen will.“\n',
              parts['ADD32'],
              'chapter 32'
          )
          text = apply_once(
              text,
              'Dann speicherte er.\n',
              parts['ADD33'],
              'chapter 33'
          )

          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b06-depth-once.yml .github/b06-depth-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Deepen consequences across chapters 28 to 33'
          git push
