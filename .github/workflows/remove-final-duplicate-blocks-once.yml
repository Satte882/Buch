name: Remove final duplicate manuscript blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-final-duplicate-blocks-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Remove accidental duplicate manuscript blocks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove eight verified duplicate blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          text = path.read_text(encoding='utf-8')

          blocks = [
              '„Dann entscheide ich mit dem, was ich habe.“',
              'Die Tatsache, dass jemand wusste, welchen Ausgang Jana benutzt hatte, bewies genau eine Sache: Jemand wusste es.',
              'Das war der Kompromiss.\n\nNicht seiner.\n\nIhrer.',
              'Das war schlimmer als ein eindeutiger Fehlschlag.',
              'Lena war nicht das Leck.',
              '„Dann schließen wir sie nicht als harmlos“, sagte er. „Aber wir machen auch nichts daraus, bis ein zweiter Anker kommt.“',
              'Nicht alles daran betraf ihn.\n\nDas war vermutlich der Punkt.',
              'In Kapitel 1 hätte ihm das gereicht.',
          ]

          for block in blocks:
              doubled = block + '\n\n' + block
              count = text.count(doubled)
              if count != 1:
                  raise SystemExit(f'duplicate block count={count}: {block[:80]!r}')
              text = text.replace(doubled, block, 1)

          # Protect chapter structure and ensure the duplicates are gone.
          for block in blocks:
              if block + '\n\n' + block in text:
                  raise SystemExit(f'duplicate remained: {block[:80]!r}')

          path.write_text(text, encoding='utf-8')
          print('PASS removed 8 verified duplicate blocks')
          PY

      - name: Self-remove and commit
        shell: bash
        run: |
          git rm .github/workflows/remove-final-duplicate-blocks-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Remove accidental duplicate manuscript blocks'
          git push
