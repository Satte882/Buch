name: Manuskript-Metriken

on:
  push:
    branches: [main]
    paths:
      - 'MANUSKRIPT/**'
      - '.github/workflows/manuskript-metriken.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wortzahlen je Kapitel und Baustein berechnen
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('MANUSKRIPT/01_BAUSTEINE_01_02.md'),
              Path('MANUSKRIPT/02_BAUSTEINE_03_04.md'),
              Path('MANUSKRIPT/03_BAUSTEINE_05_06.md'),
              Path('MANUSKRIPT/04_BAUSTEIN_07.md'),
              Path('MANUSKRIPT/05_BAUSTEINE_08_09.md'),
          ]

          sections = {}
          heading_re = re.compile(r'^##\s+(Prolog|\d+)\s*$', re.MULTILINE)
          word_re = re.compile(r"\b[\wÄÖÜäöüß]+(?:[-’'][\wÄÖÜäöüß]+)*\b", re.UNICODE)

          for path in files:
              text = path.read_text(encoding='utf-8')
              matches = list(heading_re.finditer(text))
              for i, match in enumerate(matches):
                  name = match.group(1)
                  start = match.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
                  body = text[start:end]
                  sections[name] = len(word_re.findall(body))

          expected = ['Prolog'] + [str(i) for i in range(1, 48)]
          missing = [x for x in expected if x not in sections]
          extra = [x for x in sections if x not in expected]
          if missing or extra:
              raise SystemExit(f'Kapitelstruktur fehlerhaft. Fehlend={missing}, zusätzlich={extra}')

          bausteine = {
              '01': ['Prolog'],
              '02': [str(i) for i in range(1, 7)],
              '03': [str(i) for i in range(7, 14)],
              '04': [str(i) for i in range(14, 19)],
              '05': [str(i) for i in range(19, 26)],
              '06': [str(i) for i in range(26, 34)],
              '07': [str(i) for i in range(34, 38)],
              '08': [str(i) for i in range(38, 44)],
              '09': [str(i) for i in range(44, 48)],
          }
          references = {
              '01': 800,
              '02': 9000,
              '03': 11000,
              '04': 8500,
              '05': 12000,
              '06': 13400,
              '07': 7000,
              '08': 10500,
              '09': 4800,
          }
          names = {
              '01': 'Cold Open',
              '02': 'Ausgangswelt Daniel',
              '03': 'Auslösendes Ereignis',
              '04': 'Erste Entscheidung',
              '05': 'Entdeckung & Eskalation',
              '06': 'Moralischer / psychologischer Kipppunkt',
              '07': 'Reversal / Umdeutung',
              '08': 'Finale Entscheidung & Konsequenz',
              '09': 'Nachhall / Schlussszene',
          }

          btotals = {b: sum(sections[k] for k in ks) for b, ks in bausteine.items()}
          total = sum(btotals.values())
          reference_total = sum(references.values())

          lines = [
              '# Manuskript-Metriken',
              '',
              '> Automatisch aus `MANUSKRIPT/*.md` erzeugt. Diese Datei nicht manuell pflegen.',
              '>',
              '> **Steuerungsregel:** Wortzahl ist eine Messgröße, kein Qualitäts- oder Abnahmekriterium. Die 77.000 Wörter und Bausteinwerte sind nur historische Ausbau-Referenzen; es wird nicht auf sie hin gekürzt oder aufgefüllt.',
              '',
              '## Gesamtstand',
              '',
              f'- **Ist:** {total:,} Wörter'.replace(',', '.'),
              f'- **Historische Planungsreferenz:** {reference_total:,} Wörter'.replace(',', '.'),
              f'- **Abweichung zur historischen Referenz:** {total-reference_total:+,} Wörter'.replace(',', '.'),
              '',
              '## Bausteine – Ist gegen historische Ausbau-Referenz',
              '',
              '| Baustein | Funktion | Ist Wörter | historische Referenz | Abweichung |',
              '|---|---|---:|---:|---:|',
          ]
          for b in bausteine:
              actual = btotals[b]
              reference = references[b]
              delta = actual - reference
              lines.append(
                  f"| {b} | {names[b]} | {actual:,} | {reference:,} | {delta:+,} |"
                  .replace(',', '.')
              )

          lines += [
              '',
              '## Kapitel – Ist-Wortzahl',
              '',
              '| Baustein | Kapitel | Ist Wörter |',
              '|---|---|---:|',
          ]
          for b, ks in bausteine.items():
              for k in ks:
                  lines.append(f"| {b} | {k} | {sections[k]:,} |".replace(',', '.'))

          lines += [
              '',
              '## Zählregel',
              '',
              'Gezählt wird reproduzierbar aus dem Prosatext unter den Überschriften `## Prolog` und `## 1` bis `## 47`. Markdown-Überschriften selbst zählen nicht. Wörter mit Bindestrich oder Apostroph werden als ein Wort behandelt. Die Zahl kann geringfügig von Microsoft Word abweichen.',
              '',
              'Die historischen Referenzwerte stammen aus der früheren Ausbauplanung in `UMFANG_UND_AUSBAUSTEUERUNG.md`. Für die aktuelle Manuskriptphase gilt: Umfang folgt Funktion.',
          ]

          Path('MANUSKRIPT_METRIKEN.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Metriken committen
        run: |
          if [ -z "$(git status --porcelain -- MANUSKRIPT_METRIKEN.md)" ]; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANUSKRIPT_METRIKEN.md
          git commit -m "Update manuscript metrics"
          git push
