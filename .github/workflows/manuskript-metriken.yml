name: Manuskript-Metriken

on:
  push:
    branches: [main]
    paths:
      - 'AUSNAHMEZUSTAND_FINAL.md'
      - '.github/workflows/manuskript-metriken.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wortzahlen aus finalem Master berechnen
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('AUSNAHMEZUSTAND_FINAL.md')
          text = path.read_text(encoding='utf-8')
          heading_re = re.compile(r'^##\s+(Prolog|\d+)\s*$', re.MULTILINE)
          word_re = re.compile(r"\b[\wÄÖÜäöüß]+(?:[-’'][\wÄÖÜäöüß]+)*\b", re.UNICODE)

          matches = list(heading_re.finditer(text))
          sections = {}
          for i, match in enumerate(matches):
              name = match.group(1)
              start = match.end()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
              sections[name] = len(word_re.findall(text[start:end]))

          expected = ['Prolog'] + [str(i) for i in range(1, 48)]
          if list(sections) != expected:
              raise SystemExit(f'Kapitelstruktur fehlerhaft: {list(sections)}')

          bausteine = {
              '01': ['Prolog'],
              '02': [str(i) for i in range(1, 7)],
              '03': [str(i) for i in range(7, 14)],
              '04': [str(i) for i in range(14, 19)],
              '05': [str(i) for i in range(19, 26)],
              '06': [str(i) for i in range(26, 34)],
              '07': [str(i) for i in range(34, 38)],
              '08': [str(i) for i in range(38, 44)],
              '09': [str(i) for i in range(44, 48)],
          }
          names = {
              '01': 'Cold Open',
              '02': 'Ausgangswelt Daniel',
              '03': 'Auslösendes Ereignis',
              '04': 'Erste Entscheidung',
              '05': 'Entdeckung & Eskalation',
              '06': 'Moralischer / psychologischer Kipppunkt',
              '07': 'Reversal / Umdeutung',
              '08': 'Finale Entscheidung & Konsequenz',
              '09': 'Nachhall / Schlussszene',
          }

          btotals = {b: sum(sections[k] for k in ks) for b, ks in bausteine.items()}
          total = sum(sections.values())

          lines = [
              '# Manuskript-Metriken',
              '',
              '> Automatisch aus `AUSNAHMEZUSTAND_FINAL.md` erzeugt. Diese Datei nicht manuell pflegen.',
              '>',
              '> **Steuerungsregel:** Wortzahl ist ausschließlich eine Messgröße. Historische Ausbauziele sind kein Qualitäts- oder Abnahmekriterium.',
              '',
              '## Gesamtstand',
              '',
              f'- **Ist:** {total:,} Wörter'.replace(',', '.'),
              '- **Quelle:** `AUSNAHMEZUSTAND_FINAL.md`',
              '',
              '## Bausteine – aktuelle Ist-Wortzahl',
              '',
              '| Baustein | Funktion | Ist Wörter |',
              '|---|---|---:|',
          ]
          for b in bausteine:
              lines.append(f"| {b} | {names[b]} | {btotals[b]:,} |".replace(',', '.'))

          lines += [
              '',
              '## Kapitel – aktuelle Ist-Wortzahl',
              '',
              '| Baustein | Kapitel | Ist Wörter |',
              '|---|---|---:|',
          ]
          for b, ks in bausteine.items():
              for k in ks:
                  lines.append(f"| {b} | {k} | {sections[k]:,} |".replace(',', '.'))

          lines += [
              '',
              '## Zählregel',
              '',
              'Gezählt wird reproduzierbar ausschließlich aus dem Prosatext unter `## Prolog` und `## 1` bis `## 47` im finalen Markdown-Master. Markdown-Überschriften selbst zählen nicht. Wörter mit Bindestrich oder Apostroph werden als ein Wort behandelt. Microsoft Word kann geringfügig anders zählen.',
              '',
              'Historische Wortziele aus der Ausbauphase sind über Git nachvollziehbar, werden aber nicht mehr als aktive Steuerungslogik geführt.',
          ]

          Path('MANUSKRIPT_METRIKEN.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Metriken committen
        run: |
          if [ -z "$(git status --porcelain -- MANUSKRIPT_METRIKEN.md)" ]; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANUSKRIPT_METRIKEN.md
          git commit -m "Update manuscript metrics"
          git pull --rebase origin main
          git push
