name: Temporary final style depth correction

on:
  push:
    paths:
      - scripts/style_depth_fix_temp.py
      - .github/workflows/style-depth-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/style_depth_fix_temp.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSNAHMEZUSTAND_FINAL.md
          git commit -m "Polish final prose contrast"
          git pull --rebase origin main
          git push
