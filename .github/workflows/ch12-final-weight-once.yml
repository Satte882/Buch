name: Chapter 12 final weight correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch12-final-weight-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply final chapter-12 weight correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add final functional beat to chapter 12
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MANUSKRIPT/02_BAUSTEINE_03_04.md')
          text = p.read_text(encoding='utf-8')
          anchor = 'Sie sahen aus wie Ordnung.\n\nTatsächlich bedeuteten sie auch, dass er beim nächsten Mal früher handlungsfähig sein wollte.\n'
          addition = '''Daniel setzte den Cursor noch einmal darunter.\n\nFrüher handlungsfähig durfte nicht heißen: früher überzeugt.\n\nEr ergänzte drei Grenzen.\n\n**Kein Eingriff allein wegen einer Quellenbehauptung.**\n\n**Keine Erweiterung eines Datenzugriffs, nur weil die Zeit knapp ist.**\n\n**Widerlegte Teile bleiben widerlegt, auch wenn ein anderer Teil später stimmt.**\n\nEr las die Sätze.\n\nDas war keine neue Befugnis. Nicht einmal eine neue Schwelle. Es war ein Versuch, die Zeit zwischen Hinweis und sauberer Prüfung zu verkürzen, ohne das Ergebnis der Prüfung vorwegzunehmen.\n\nDaniel schob die drei Felder in eine kleine Vorlage. Neben jedem offenen Punkt musste künftig stehen, welche Prüfung bereits möglich war und was daraus ausdrücklich noch nicht folgen durfte.\n\nDie Vorlage würde niemanden festhalten, keinen Zugriff freigeben und keine Zweckgrenze verschieben.\n\nSie würde nur verhindern, dass eine prüfbare Frage liegen blieb, bis eine andere beantwortet war.\n\nDaniel sah auf die Zeitlinie vom Betriebshof.\n\nGenau diese Art verlorener Zeit wollte er nicht noch einmal verschenken.\n\nMehr hatte er sich in dieser Nacht noch nicht erlaubt.\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'anchor count {text.count(anchor)}')
          text = text.replace(anchor, anchor + '\n' + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove and commit
        shell: bash
        run: |
          git rm .github/workflows/ch12-final-weight-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/02_BAUSTEINE_03_04.md
          git commit -m 'Clarify chapter 12 process boundary'
          git push
