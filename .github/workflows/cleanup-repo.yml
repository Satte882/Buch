name: Cleanup Repository

on:
  push:
    paths:
      - .github/workflows/cleanup-repo.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches and failed runs
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'tmp/final-aggregate',
              'tmp/final-part2',
              'tmp/final-union-aggregate',
              'tmp/final-union-base',
              'tmp/final-union-part2'
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`deleted branch ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`branch already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }

            const failedRunIds = [
              32988843329,
              32988810956
            ];
            for (const run_id of failedRunIds) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                core.info(`deleted workflow run ${run_id}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`workflow run already absent: ${run_id}`);
                } else {
                  throw error;
                }
              }
            }

# trigger existing cleanup workflow
