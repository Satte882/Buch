name: Cleanup Repository

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches and failed runs
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'tmp/final-aggregate',
              'tmp/final-part2',
              'tmp/final-union-aggregate',
              'tmp/final-union-base',
              'tmp/final-union-part2'
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`deleted branch ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`branch already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            for (const run of runs) {
              if (run.conclusion !== 'failure' || run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                core.info(`deleted failed workflow run ${run.id}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`workflow run already absent: ${run.id}`);
                } else {
                  throw error;
                }
              }
            }
