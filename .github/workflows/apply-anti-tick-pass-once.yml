name: Apply anti-tick pass once

on:
  push:
    paths:
      - scripts/apply_anti_tick_pass.py
      - .github/workflows/apply-anti-tick-pass-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contextual manuscript pass and rebuild final
        run: python scripts/apply_anti_tick_pass.py
      - name: Validate manuscript invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('AUSNAHMEZUSTAND_FINAL.md').read_text(encoding='utf-8')
          heads=re.findall(r'^## (Prolog|\d+)$',text,re.M)
          assert heads==['Prolog']+[str(i) for i in range(1,48)], heads
          assert text.startswith('# Ausnahmezustand\n')
          assert 'Die Hand war leer.' in text
          assert 'Nicht gesendet.' in text
          assert 'Terminal in der linken Hand' in text
          assert text.rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“')
          print('all invariants green')
          PY
      - name: Commit anti-tick pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANUSKRIPT/*.md AUSNAHMEZUSTAND_FINAL.md UMFANG_UND_AUSBAUSTEUERUNG.md ANTI_TICK_SCAN_TEMP.md ANTI_TICK_DETAIL_TEMP.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Polish manuscript language patterns"
          git push
