name: Build test-reader DOCX

on:
  workflow_dispatch:
  push:
    paths:
      - AUSNAHMEZUSTAND_FINAL.md
      - scripts/build_testreader_docx.py
      - .github/workflows/build-testreader-docx.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate consolidated manuscript source
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('AUSNAHMEZUSTAND_FINAL.md').read_text(encoding='utf-8')
          assert text.startswith('# Ausnahmezustand\n')
          assert re.findall(r'^## (Prolog|\d+)$', text, re.M) == ['Prolog'] + [str(i) for i in range(1, 48)]
          assert text.rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“')

      - name: Install DOCX dependency
        run: python -m pip install python-docx

      - name: Build DOCX
        run: |
          python scripts/build_testreader_docx.py AUSNAHMEZUSTAND_FINAL.md AUSNAHMEZUSTAND.docx
          test -s AUSNAHMEZUSTAND.docx

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ausnahmezustand-docx
          path: AUSNAHMEZUSTAND.docx
          retention-days: 7

      - name: Commit Word manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSNAHMEZUSTAND.docx
          if git diff --cached --quiet; then
            echo "DOCX unchanged"
            exit 0
          fi
          git commit -m "Build Word test-reader manuscript"
          git push
