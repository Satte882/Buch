name: B09 closing one-time pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b09-close-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B09 closing pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close chapters 44 to 46
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b09-close-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['44','45','46']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          def ins(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: anchor count {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          text = ins(text, 'Die Referentin setzte nur einen Haken neben seinen Namen.\n', parts['44'], '44')
          text = ins(text, 'Später gingen sie zu Fuß zur U-Bahn, weil Mara ihm noch einen Laden zeigen wollte, in dem sie einen Tisch gesehen hatte.\n', parts['45'], '45')
          text = ins(text, 'Jonas sammelte die ersten Arbeitsaufträge ein.\n', parts['46'], '46')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b09-close-once.yml .github/b09-close-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Finish aftermath chapters to minimum weight'
          git push