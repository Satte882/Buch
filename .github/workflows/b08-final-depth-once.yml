name: B08 final depth one-time pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b08-final-depth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply final B08 depth pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final B08 additions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b08-final-depth-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['38','39','40','41','42','43']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          parts['40'] = parts['40'].replace('\n\nDann erst trat er zur Seite, als der Beamte vor ihm seine Waffe verlangte.', '')
          def ins(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: anchor count {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          text = ins(text, '„Ab jetzt nur noch unser Stand“, sagte er.\n', parts['38'], '38')
          text = ins(text, 'Aber ein aktueller, eigener Grund, es aus dem Verkehr zu ziehen und die Personen dahinter zu klären.\n', parts['39'], '39')
          text = ins(text, 'Jetzt senkte er die Pistole.\n', parts['40'], '40')
          text = ins(text, 'Der Bereich mit den acht Beschäftigten wurde nicht über den alten Zugang betreten. Eine zweite Gruppe übernahm die Räumung. Der operative Schritt verschob sich.\n', parts['41'], '41')
          text = ins(text, '„Damit kann ich was anfangen.“\n', parts['42'], '42')
          text = ins(text, '„Dann alles.“\n', parts['43'], '43')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b08-final-depth-once.yml .github/b08-final-depth-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Finish finale block to chapter minimums'
          git push