name: Final entry-flow polish
on:
  push:
    paths:
      - '.github/workflows/entry-flow-final-polish-once.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove two remaining reader-flow redundancies and rebuild final
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('MANUSKRIPT/02_BAUSTEINE_03_04.md')
          t = p.read_text(encoding='utf-8')
          edits = [
              ('Er prüfte die Uhrzeit noch einmal.\n\nDann den Briefkasten.\n\n20.11 Uhr.\n\nDaniel ging zurück in den zweiten Stock.',
               'Er prüfte die Uhrzeit noch einmal.\n\nDaniel ging zurück in den zweiten Stock.',
               'K8 repeated private timestamp'),
              ('Lena ließ sich mit der Antwort zufrieden geben. Vorerst.\n\n', '', 'K9 contradictory pause'),
          ]
          for old,new,label in edits:
              n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              t=t.replace(old,new,1)
          p.write_text(t, encoding='utf-8')

          paths = [
              Path('MANUSKRIPT/01_BAUSTEINE_01_02.md'), p,
              Path('MANUSKRIPT/03_BAUSTEINE_05_06.md'),
              Path('MANUSKRIPT/04_BAUSTEIN_07.md'),
              Path('MANUSKRIPT/05_BAUSTEINE_08_09.md'),
          ]
          expected_by_file = [
              ['Prolog']+[str(i) for i in range(1,7)],
              [str(i) for i in range(7,19)],
              [str(i) for i in range(19,34)],
              [str(i) for i in range(34,38)],
              [str(i) for i in range(38,48)],
          ]
          heading_re=re.compile(r'^##\s+(Prolog|\d+)\s*$',re.M)
          word_re=re.compile(r"\b[\wÄÖÜäöüß]+(?:[-’'][\wÄÖÜäöüß]+)*\b",re.UNICODE)
          sections={}
          for path,exp in zip(paths,expected_by_file):
              text=path.read_text(encoding='utf-8')
              heads=[m.group(1) for m in heading_re.finditer(text)]
              if heads != exp: raise SystemExit(f'{path}: structure changed')
              ms=list(heading_re.finditer(text))
              for i,m in enumerate(ms):
                  end=ms[i+1].start() if i+1<len(ms) else len(text)
                  body=re.sub(r'\n\s*---\s*$','',text[m.end():end].strip()).strip()
                  sections[m.group(1)]=body
          expected=['Prolog']+[str(i) for i in range(1,48)]
          if list(sections) != expected: raise SystemExit('global chapter order changed')
          if 'Lagerhaus C, Einheit 17.' not in sections['5']: raise SystemExit('K5 anchor lost')
          if '**Hamburg. Nicht irgendwann.**' not in sections['6']: raise SystemExit('K6 anchor lost')
          if '20.11 Uhr. Hausflur Ihrer Mutter.' not in sections['8']: raise SystemExit('K8 private line lost')
          if 'unten drei Zentimeter mehr Rand sind als oben' not in sections['9']: raise SystemExit('K9 deduction lost')
          if 'Terminal in der linken Hand' not in sections['40']: raise SystemExit('finale continuity lost')
          if not sections['47'].rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“'): raise SystemExit('final line changed')
          for ch in expected:
              paras=[re.sub(r'\s+',' ',x).strip() for x in re.split(r'\n\s*\n',sections[ch])]
              paras=[x for x in paras if x and x!='---']
              for i in range(len(paras)-1):
                  if paras[i]==paras[i+1] and len(paras[i])>=15: raise SystemExit(f'ch {ch}: direct repeat')
          total=sum(len(word_re.findall(sections[ch])) for ch in expected)
          chunks=['# Ausnahmezustand']+[f'## {ch}\n\n{sections[ch]}' for ch in expected]
          Path('AUSNAHMEZUSTAND_FINAL.md').write_text('\n\n---\n\n'.join(chunks)+'\n',encoding='utf-8')
          print(f'PASS final entry polish: words={total}')
          PY
      - name: Self-remove and commit
        shell: bash
        run: |
          git rm .github/workflows/entry-flow-final-polish-once.yml
          git add MANUSKRIPT/02_BAUSTEINE_03_04.md AUSNAHMEZUSTAND_FINAL.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish external reader-pass opening polish'
          git push