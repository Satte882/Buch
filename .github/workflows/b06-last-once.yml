name: B06 final minimum one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b06-last-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply final B06 minimum pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final B06 minimum additions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('MANUSKRIPT/03_BAUSTEINE_05_06.md')
          patchpath = Path('.github/b06-last-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          p = patchpath.read_text(encoding='utf-8')

          labels = ['ADD30', 'ADD31', 'ADD32', 'ADD33']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = p.index(marker) + len(marker)
              if i + 1 < len(labels):
                  end = p.index(f'==={labels[i+1]}===\n', start)
              else:
                  end = len(p)
              parts[label] = p[start:end].strip()

          def apply_once(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: expected anchor once, got {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)

          text = apply_once(text, 'Er schloss den Vermerk wieder.\n', parts['ADD30'], 'chapter 30')
          text = apply_once(text, '„Das reicht auch nicht“, sagte Daniel.\n', parts['ADD31'], 'chapter 31')
          text = apply_once(text, '„Das wäre schön.“\n\nMehr machte sie daraus nicht.\n', parts['ADD32'], 'chapter 32')
          text = apply_once(
              text,
              'Kurz davor blieb sie stehen, als hätte sie noch etwas sagen wollen.\n\nTat sie nicht.\n\nDie Tür fiel hinter ihr zu.\n',
              parts['ADD33'],
              'chapter 33'
          )

          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b06-last-once.yml .github/b06-last-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/03_BAUSTEINE_05_06.md
          git commit -m 'Finish moral pivot chapters to minimum weight'
          git push
