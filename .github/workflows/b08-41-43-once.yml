name: B08 chapters 41 to 43 one-time expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b08-41-43-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B08 chapters 41 to 43 expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand chapters 41 to 43
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b08-41-43-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['41a','41b','41c','42a','42b','42c','43a','43b','43c']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          def ins(src, anchor, addition, label):
              if src.count(anchor) != 1:
                  raise SystemExit(f'{label}: anchor count {src.count(anchor)}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          text = ins(text, '„Dann bleibt er draußen.“\n\n„Verstanden.“\n', parts['41a'], '41a')
          text = ins(text, 'Dann nichts für fast eine Minute.\n', parts['41b'], '41b')
          text = ins(text, '„Nach jetzigem Stand: ja.“\n', parts['41c'], '41c')
          text = ins(text, 'Die äußere Gefahr war trotzdem real gewesen.\n', parts['42a'], '42a')
          text = ins(text, '„Ich mache morgen noch zu.“\n', parts['42b'], '42b')
          text = ins(text, '„Offenbar.“\n', parts['42c'], '42c')
          text = ins(text, 'Dritte Mappe.\n', parts['43a'], '43a')
          text = ins(text, '„Nicht sicher ist nicht dasselbe wie ausgeschlossen.“\n\n„Nein.“\n', parts['43b'], '43b')
          text = ins(text, '„Das ist doch vernünftig.“\n\n„Kann sein“, sagte Lena.\n', parts['43c'], '43c')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b08-41-43-once.yml .github/b08-41-43-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Expand finale consequences chapters 41 to 43'
          git push