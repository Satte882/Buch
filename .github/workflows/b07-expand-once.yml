name: B07 reversal one-time expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b07-expand-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B07 reversal expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand chapters 34 to 37
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('MANUSKRIPT/04_BAUSTEIN_07.md')
          patchfile = Path('.github/b07-expand-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')

          labels = ['34a', '34b', '35', '36', '36b', '37', '37b']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              if i + 1 < len(labels):
                  end = patch.index(f'==={labels[i+1]}===\n', start)
              else:
                  end = len(patch)
              parts[label] = patch[start:end].strip()

          def insert_after(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: expected anchor once, got {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)

          text = insert_after(text, '„Dann nicht.“\n\nWeg damit.\n', parts['34a'], '34a')
          text = insert_after(text, '„Nach Stellen, an denen die weggelassene Information die Entscheidung verändert hätte.“\n', parts['34b'], '34b')
          text = insert_after(text, '„Nein. Nur, dass wir früher einen engeren, sachnäheren Prüfweg gehabt hätten als mit der Warnung allein.“\n', parts['35'], '35')
          text = insert_after(text, 'Heller verband beides mit dem Davor.\n', parts['36'], '36')
          text = insert_after(text, '„Dann sieht es vernünftig aus.“\n', parts['36b'], '36b')
          text = insert_after(text, '„Nur die beiden Dinge. Kennung und Fahrzeug. Der Rest existiert für dich nicht.“\n', parts['37'], '37')
          text = insert_after(text, 'Dann: „Und wenn er recht hat?“\n', parts['37b'], '37b')

          manuscript.write_text(text, encoding='utf-8')
          PY

      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b07-expand-once.yml .github/b07-expand-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/04_BAUSTEIN_07.md
          git commit -m 'Expand reversal chapters 34 to 37'
          git push
