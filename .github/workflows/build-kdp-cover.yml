name: Build NORMALFALL KDP cover

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_kdp_cover.py'
      - 'COVER_SPEC.md'
      - '.github/workflows/build-kdp-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          pip install pillow pymupdf pypdf

      - name: Build live KDP cover
        run: |
          python scripts/build_kdp_cover.py --output NORMALFALL_COVER.pdf --dpi 400

      - name: Validate KDP PDF
        run: |
          pdfinfo NORMALFALL_COVER.pdf
          pdffonts NORMALFALL_COVER.pdf
          pdfimages -list NORMALFALL_COVER.pdf

          python - <<'PY'
          from pypdf import PdfReader
          r = PdfReader('NORMALFALL_COVER.pdf')
          assert len(r.pages) == 1
          box = r.pages[0].mediabox
          w = float(box.width) / 72
          h = float(box.height) / 72
          assert abs(w - 13.356) < 0.0001, (w, h)
          assert abs(h - 9.250) < 0.0001, (w, h)
          print('cover geometry OK', w, h)
          PY

          if pdffonts NORMALFALL_COVER.pdf | tail -n +3 | grep -q '[^[:space:]]'; then
            echo 'Unexpected PDF font resource found' >&2
            pdffonts NORMALFALL_COVER.pdf >&2
            exit 1
          else
            echo 'fontless cover PDF OK'
          fi

          pdfimages -list NORMALFALL_COVER.pdf | awk '
            NR > 2 && $3 == "image" {
              found=1
              if ($13 < 300 || $14 < 300) {
                print "image resolution below 300 dpi:", $0 > "/dev/stderr"
                exit 1
              }
            }
            END { if (!found) exit 2 }
          '

      - name: Commit production PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NORMALFALL_COVER.pdf
          if git diff --cached --quiet; then
            echo 'No cover change.'
          else
            git commit -m 'production: build live KDP NORMALFALL cover'
            git push
          fi
