name: Temporary rhythm pass correction

on:
  push:
    paths:
      - scripts/rhythm_pass_fix_temp.py
      - .github/workflows/rhythm-pass-fix-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/rhythm_pass_fix_temp.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSNAHMEZUSTAND_FINAL.md
          git commit -m "Remove rhythm-pass redundancy"
          git pull --rebase origin main
          git push
