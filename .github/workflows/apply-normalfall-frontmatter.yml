name: Apply Normalfall frontmatter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-normalfall-frontmatter.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update existing frontmatter and builder
        shell: python
        run: |
          from pathlib import Path
          import re

          final_path = Path('AUSNAHMEZUSTAND_FINAL.md')
          text = final_path.read_text(encoding='utf-8')
          old_front = '\n'.join([
              '# NORMALFALL',
              '',
              '*Psychothriller*',
              '',
              '---',
              '',
              '**Normalfall**',
              '',
              'Ein Vorgang, der nach den üblichen Regeln behandelt werden kann.',
              '',
              '*Eine Regel widersteht allem, außer dem Beweis, dass es ohne sie besser geht.*',
              '',
              '---',
              '',
              '## Prolog',
              '',
          ])
          new_front = '\n'.join([
              '# NORMALFALL',
              '',
              '*Psychothriller*',
              '',
              '---',
              '',
              '**Normalfall, der:** Ein Fall, der nach den üblichen Regeln behandelt wird.',
              '',
              '*Eine Regel widersteht allem, außer dem Beweis, dass es ohne sie besser geht.*',
              '',
              '---',
              '',
              '## Prolog',
              '',
          ])
          assert text.startswith(old_front), 'Unexpected current frontmatter'
          final_path.write_text(new_front + text[len(old_front):], encoding='utf-8')

          builder_path = Path('scripts/build_testreader_docx.py')
          builder = builder_path.read_text(encoding='utf-8')
          old_builder = '\n'.join([
              '    definition_title = doc.add_paragraph()',
              '    definition_title.alignment = WD_ALIGN_PARAGRAPH.CENTER',
              '    definition_title.paragraph_format.first_line_indent = Cm(0)',
              '    definition_title.paragraph_format.space_after = Pt(6)',
              '    run = definition_title.add_run("Normalfall")',
              '    run.bold = True',
              '    set_run_font(run, size=13)',
              '',
              '    definition = doc.add_paragraph()',
              '    definition.alignment = WD_ALIGN_PARAGRAPH.CENTER',
              '    definition.paragraph_format.first_line_indent = Cm(0)',
              '    definition.paragraph_format.space_after = Pt(30)',
              '    run = definition.add_run("Ein Vorgang, der nach den üblichen Regeln behandelt werden kann.")',
              '    set_run_font(run, size=12)',
          ])
          new_builder = '\n'.join([
              '    definition = doc.add_paragraph()',
              '    definition.alignment = WD_ALIGN_PARAGRAPH.CENTER',
              '    definition.paragraph_format.first_line_indent = Cm(0)',
              '    definition.paragraph_format.space_after = Pt(30)',
              '    run = definition.add_run("Normalfall, der: Ein Fall, der nach den üblichen Regeln behandelt wird.")',
              '    set_run_font(run, size=12)',
          ])
          assert old_builder in builder, 'Unexpected current builder frontmatter'
          builder_path.write_text(builder.replace(old_builder, new_builder, 1), encoding='utf-8')

          check = final_path.read_text(encoding='utf-8')
          front = check.split('## Prolog', 1)[0]
          assert 'Normalfall, der: Ein Fall, der nach den üblichen Regeln behandelt wird.' in front
          assert 'Eine Regel widersteht allem, außer dem Beweis, dass es ohne sie besser geht.' in front
          assert re.findall(r'^## (Prolog|\d+)$', check, re.M) == ['Prolog'] + [str(i) for i in range(1, 48)]
          assert check.rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSNAHMEZUSTAND_FINAL.md scripts/build_testreader_docx.py
          git commit -m "Refine Normalfall frontmatter"
          git push
