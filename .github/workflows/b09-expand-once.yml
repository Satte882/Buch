name: B09 aftermath one-time expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b09-expand-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply B09 aftermath expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand chapters 44 to 47
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manuscript = Path('MANUSKRIPT/05_BAUSTEINE_08_09.md')
          patchfile = Path('.github/b09-expand-patch.txt')
          text = manuscript.read_text(encoding='utf-8')
          patch = patchfile.read_text(encoding='utf-8')
          labels = ['44a','44b','44c','45a','45b','45c','46a','46b','46c','47a','47b','47c']
          parts = {}
          for i, label in enumerate(labels):
              marker = f'==={label}===\n'
              start = patch.index(marker) + len(marker)
              end = patch.index(f'==={labels[i+1]}===\n', start) if i + 1 < len(labels) else len(patch)
              parts[label] = patch[start:end].strip()
          def ins(src, anchor, addition, label):
              count = src.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: anchor count {count}')
              return src.replace(anchor, anchor + '\n' + addition + '\n', 1)
          text = ins(text, '„Also gut.“\n\n„Habe ich nicht gesagt.“\n', parts['44a'], '44a')
          text = ins(text, 'Er hatte für einige davon selbst argumentiert.\n', parts['44b'], '44b')
          text = ins(text, 'Keines hob das andere auf.\n', parts['44c'], '44c')
          text = ins(text, 'Nichts wartete darauf, dass sie zurückging.\n', parts['45a'], '45a')
          text = ins(text, 'Mara kommentierte es nicht.\n', parts['45b'], '45b')
          text = ins(text, 'Sie kauften nichts.\n', parts['45c'], '45c')
          text = ins(text, '„Eine Stunde“, sagte Jonas.\n', parts['46a'], '46a')
          text = ins(text, '„Prüfe ich.“\n', parts['46b'], '46b')
          text = ins(text, 'Es lag einfach auf dem Tisch.\n', parts['46c'], '46c')
          text = ins(text, 'Sein Vorschlag war trotzdem breiter.\n', parts['47a'], '47a')
          text = ins(text, 'Als wäre genau das der Punkt, über den man entscheiden musste.\n', parts['47b'], '47b')
          text = ins(text, 'Das machte es schwieriger.\n', parts['47c'], '47c')
          manuscript.write_text(text, encoding='utf-8')
          PY
      - name: Self-remove temporary files and commit
        shell: bash
        run: |
          git rm .github/workflows/b09-expand-once.yml .github/b09-expand-patch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANUSKRIPT/05_BAUSTEINE_08_09.md
          git commit -m 'Expand aftermath chapters 44 to 47'
          git push