name: Build canonical book DOCX

on:
  workflow_dispatch:
  push:
    paths:
      - AUSNAHMEZUSTAND_FINAL.md
      - MANUSKRIPT_FORMATIERUNG.md
      - scripts/build_book_docx.py
      - scripts/polish_docx.py
      - scripts/kdp_book_layout.py
      - scripts/audit_scene_breaks.py
      - scripts/update_docx_toc.py
      - .github/workflows/build-book-docx.yml

permissions:
  contents: write

# A DOCX build is comparatively slow. If several relevant commits arrive in
# quick succession, only the newest main-branch build should finish and write
# the canonical generated document. Manual and content-triggered builds share
# the same lock.
concurrency:
  group: canonical-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manuscript structure
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('AUSNAHMEZUSTAND_FINAL.md').read_text(encoding='utf-8')
          assert re.findall(r'^## (Prolog|\d+)$', text, re.M) == ['Prolog'] + [str(i) for i in range(1, 48)]
          assert text.rstrip().endswith('„Wie belastbar ist deine Gegenhypothese?“')
          assert '—' not in text
          assert re.search(r'\bsondern\b', text, re.I) is None

      - name: Audit semantic scene breaks
        run: python scripts/audit_scene_breaks.py AUSNAHMEZUSTAND_FINAL.md

      - name: Install DOCX dependencies
        run: |
          python -m pip install python-docx pyphen
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno hyphen-de poppler-utils

      - name: Build canonical KDP paperback DOCX
        run: |
          python scripts/build_book_docx.py AUSNAHMEZUSTAND_FINAL.md AUSNAHMEZUSTAND.docx
          python scripts/kdp_book_layout.py AUSNAHMEZUSTAND.docx
          /usr/bin/python3 scripts/update_docx_toc.py AUSNAHMEZUSTAND.docx
          # Reapply after TOC materialization so the final file contains the
          # canonical KDP geometry and proper Word optional-hyphen elements,
          # never literal U+00AD text characters.
          python scripts/kdp_book_layout.py AUSNAHMEZUSTAND.docx
          unzip -t AUSNAHMEZUSTAND.docx >/dev/null

      - name: Validate KDP paperback layout
        shell: python
        run: |
          from docx import Document
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml.ns import qn

          doc = Document('AUSNAHMEZUSTAND.docx')

          for section in doc.sections:
              assert abs(section.page_width.cm - 12.85) < 0.02
              assert abs(section.page_height.cm - 19.84) < 0.02
              assert abs(section.top_margin.cm - 1.22) < 0.02
              assert abs(section.bottom_margin.cm - 1.22) < 0.02
              assert abs(section.left_margin.cm - 1.78) < 0.02
              assert abs(section.right_margin.cm - 1.57) < 0.02
              assert abs(section.footer_distance.cm - 0.75) < 0.02

              text_width = section.page_width.cm - section.left_margin.cm - section.right_margin.cm
              text_height = section.page_height.cm - section.top_margin.cm - section.bottom_margin.cm
              assert abs(text_width - 9.50) < 0.03
              assert abs(text_height - 17.40) < 0.03

          story_started = False
          headings = 0
          checked = 0
          literal_soft_hyphens = 0
          word_soft_hyphens = 0
          guillemets = 0

          for paragraph in doc.paragraphs:
              style_name = paragraph.style.name if paragraph.style is not None else ''
              assert '—' not in paragraph.text
              literal_soft_hyphens += paragraph.text.count('\u00ad')
              word_soft_hyphens += len(paragraph._p.xpath('.//w:softHyphen'))
              guillemets += paragraph.text.count('»') + paragraph.text.count('«')

              if style_name == 'Heading 1':
                  story_started = True
                  headings += 1
                  assert paragraph.paragraph_format.page_break_before is True
                  continue
              if not story_started or style_name != 'Normal' or not paragraph.text.strip():
                  continue

              checked += 1
              fmt = paragraph.paragraph_format
              assert paragraph.alignment == WD_ALIGN_PARAGRAPH.JUSTIFY
              indent = 0.0 if fmt.first_line_indent is None else fmt.first_line_indent.cm
              assert abs(indent) < 0.01
              after = 0.0 if fmt.space_after is None else fmt.space_after.pt
              assert abs(after) < 0.01
              assert abs(float(fmt.line_spacing) - 1.12) < 0.01
              sizes = [r.font.size.pt for r in paragraph.runs if r.font.size is not None]
              assert sizes and all(abs(size - 12.5) < 0.01 for size in sizes)
              assert all((r.font.name or '') == 'Garamond' for r in paragraph.runs)
              assert '„' not in paragraph.text and '“' not in paragraph.text

          assert headings == 48
          # Exact paragraph count is intentionally not frozen: legitimate prose
          # edits may merge/split paragraphs while chapter structure remains fixed.
          assert checked > 10000
          assert literal_soft_hyphens == 0, literal_soft_hyphens
          assert word_soft_hyphens > 1000, word_soft_hyphens
          assert guillemets > 4000

          settings = doc.settings._element
          assert settings.find(qn('w:autoHyphenation')) is not None
          assert settings.find(qn('w:doNotHyphenateCaps')) is not None
          assert settings.find(qn('w:hyphenationZone')) is not None
          assert settings.find(qn('w:consecutiveHyphenLimit')) is not None
          assert settings.find(qn('w:mirrorMargins')) is not None
          assert settings.find(qn('w:evenAndOddHeaders')) is not None

          story = doc.sections[-1]
          assert story.footer.paragraphs[0].alignment == WD_ALIGN_PARAGRAPH.RIGHT
          assert story.even_page_footer.paragraphs[0].alignment == WD_ALIGN_PARAGRAPH.LEFT
          assert all(not p.text.strip() for p in story.header.paragraphs)

          print(
              f'Validated KDP layout: headings={headings}, paragraphs={checked}, '
              f'literal_soft_hyphens={literal_soft_hyphens}, word_soft_hyphens={word_soft_hyphens}, '
              f'guillemets={guillemets}'
          )

      - name: Check KDP page-count margin band
        run: |
          mkdir -p build/kdp-preview
          libreoffice --headless --convert-to pdf --outdir build/kdp-preview AUSNAHMEZUSTAND.docx >/dev/null
          PAGES=$(pdfinfo build/kdp-preview/AUSNAHMEZUSTAND.pdf | awk '/^Pages:/ {print $2}')
          if [ -z "$PAGES" ]; then
            echo "Could not determine rendered page count"
            exit 1
          fi
          if [ "$PAGES" -lt 24 ] || [ "$PAGES" -gt 500 ]; then
            echo "Rendered page count $PAGES is outside the approved KDP band 24-500"
            exit 1
          fi
          echo "LibreOffice KDP preview page count: $PAGES"

      - name: Upload canonical DOCX
        uses: actions/upload-artifact@v4
        with:
          name: normalfall-kdp-5-06x7-81
          path: AUSNAHMEZUSTAND.docx
          retention-days: 7

      - name: Commit canonical manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUSNAHMEZUSTAND.docx
          if git diff --cached --quiet; then
            echo "Canonical manuscript unchanged"
            exit 0
          fi
          git commit -m "Refresh KDP paperback DOCX"
          # Documentation/metrics may have advanced main while this relatively
          # long DOCX build was running. Rebase this single generated-file commit
          # before pushing instead of failing on a harmless non-fast-forward.
          git pull --rebase origin main
          git push
